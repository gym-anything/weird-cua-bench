name: Deploy Weird CUA dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Export static dashboard
        run: >-
          python benchmarks/weird_captcha_gym/dashboard/export_static.py
          --output _site

      - name: Verify standalone export
        run: |
          test -f _site/index.html
          test -f _site/data/catalog.json
          test -f _site/manifest.json
          test -f _site/play/index.html
          test -f _site/play/runtime/browser_adapter.js
          test -f _site/play/runtime/demo_controls.css
          test -f _site/play/runtime/demo_controls.js
          test -f _site/play/runtime/grader_worker.js
          test ! -e _site/survey
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("_site/manifest.json").read_text())
          assert manifest["survey_included"] is False
          assert manifest["catalog"] == {
              "total": 75,
              "built": 75,
              "solution_videos": 75,
          }
          assert manifest["browser_play"] == {
              "enabled": True,
              "environments": 75,
              "challenges": 900,
              "challenges_per_environment": 4,
              "controlled_environments": 15,
              "difficulty_profiles": 75,
              "interaction_profiles": 150,
              "grader_files": 70,
              "python_runtime": "pyodide@314.0.2",
              "observation_inspector": True,
          }
          challenges = sorted(Path("_site/play/challenges").glob("*.json"))
          assert len(challenges) == 75
          for path in challenges:
              bundle = json.loads(path.read_text())
              assert bundle["version"] == 4, path
              assert set(bundle["real_time"]) == {
                  "play_time_seconds",
                  "observation_window_ms",
                  "frames_per_observation",
              }, path
              assert len(bundle["challenges"]) == 4, path
              assert len({item["ground_truth"]["challenge_id"] for item in bundle["challenges"]}) == 4, path
              if bundle["difficulty_profiles"]:
                  assert set(bundle["difficulty_profiles"]) == {"1", "2", "3", "4", "5"}, path
                  controlled = [
                      challenge
                      for profile in bundle["difficulty_profiles"].values()
                      for interaction_profile in profile["interaction_profiles"].values()
                      for challenge in interaction_profile["challenges"]
                  ]
                  assert len(controlled) == 40, path
                  assert len({item["ground_truth"]["challenge_id"] for item in controlled}) == 40, path
                  assert str(bundle["default_difficulty"]) in bundle["difficulty_profiles"], path
                  assert bundle["default_interaction"] in {"simplified", "full"}, path
                  assert all(
                      set(profile["interaction_profiles"]) == {"simplified", "full"}
                      for profile in bundle["difficulty_profiles"].values()
                  ), path
              assert (Path("_site/play") / bundle["grader"]).is_file(), path
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
