<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#090b0a">
    <meta name="description" content="Trajectory viewer for Weird CUA Bench evaluations.">
    <title>Weird CUA · Flight Recorder</title>
    <link rel="stylesheet" href="static/styles.css">
  </head>
  <body>
    <header class="masthead">
      <a class="brand" href="#" aria-label="Trajectory index">
        <span class="brand-orbit" aria-hidden="true"><i></i></span>
        <span><b>WEIRD CUA</b><em>FLIGHT RECORDER</em></span>
      </a>
      <div class="evaluation-label">
        <small>EVALUATION CORPUS</small>
        <strong id="evaluation-name">Loading…</strong>
      </div>
      <div class="header-stats" id="header-stats"></div>
    </header>

    <main class="shell">
      <aside class="run-browser">
        <div class="run-browser-head">
          <p class="eyebrow">RUN INDEX</p>
          <b id="visible-count">—</b>
        </div>
        <label class="search-field">
          <span>⌕</span>
          <input id="search" type="search" placeholder="Environment or feedback" autocomplete="off">
          <kbd>/</kbd>
        </label>
        <div class="filters" aria-label="Trajectory filters">
          <label><span>TIME</span><select id="filter-time"><option value="">All</option></select></label>
          <label><span>INPUT</span><select id="filter-interaction"><option value="">All</option></select></label>
          <label><span>STOP</span><select id="filter-reason"><option value="">All</option></select></label>
          <button id="clear-filters" type="button">CLEAR</button>
        </div>
        <div class="run-list" id="run-list" role="listbox" aria-label="Evaluation runs"></div>
      </aside>

      <section class="viewer" id="viewer">
        <div class="initial-state">
          <span class="loading-sweep"></span>
          <p>Opening trajectory corpus…</p>
        </div>
      </section>
    </main>

    <script src="static/app.js" defer></script>
  </body>
</html>
