[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "weird-cua-bench"
version = "0.1.0"
description = "Interaction-first visual puzzle benchmark for computer-use agents."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Weird CUA Bench contributors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
runtime = [
  "gym-anything[use_computer] @ git+https://github.com/cmu-l3/gym-anything.git@2775d227d6d8663376d5a67cffa9701e63d05030",
]
evaluation = [
  "gym-anything[agents,services,use_computer] @ git+https://github.com/cmu-l3/gym-anything.git@2775d227d6d8663376d5a67cffa9701e63d05030",
  "python-dotenv>=1.0",
]
test = [
  "pytest>=8.0",
  "gym-anything[agents,services] @ git+https://github.com/cmu-l3/gym-anything.git@2775d227d6d8663376d5a67cffa9701e63d05030",
  "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://gym-anything.github.io/weird-cua-bench/"
Repository = "https://github.com/gym-anything/weird-cua-bench"
Issues = "https://github.com/gym-anything/weird-cua-bench/issues"

[project.scripts]
weird-cua-dashboard = "benchmarks.weird_captcha_gym.dashboard.server:main"
weird-cua-export = "benchmarks.weird_captcha_gym.dashboard.export_static:main"
weird-cua-evaluate = "benchmarks.weird_captcha_gym.tools.run_realtime_evaluation:main"
weird-cua-worker = "benchmarks.weird_captcha_gym.evaluation.remote_worker:main"
weird-cua-creation-audit = "extras.research.controllability.creation_audit.method:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["benchmarks*", "extras*"]
namespaces = true

[tool.setuptools.package-data]
"benchmarks.weird_captcha_gym" = ["**/*"]
"extras.research.controllability.creation_audit" = ["README.md", "memory/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
